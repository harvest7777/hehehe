<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      body {
        min-width: 240px;
        margin: 0;
        padding: 24px;
        color: #202124;
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
      }

      button {
        margin-top: 16px;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #1f883d;
        cursor: pointer;
        font: inherit;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #status {
        min-height: 24px;
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <button id="try-clicking-test-button" type="button">Try clicking test button</button>
    <button id="try-debugger-click" type="button">Try debugger click</button>
    <button id="take-screenshot" type="button">Take screenshot</button>
    <p id="status" role="status"></p>
    <script src="dist/popup.js"></script>
  </body>
</html>
